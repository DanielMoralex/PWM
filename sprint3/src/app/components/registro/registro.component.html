<main class="profile-container">
  <form class="registration-form" (ngSubmit)="onSubmit()" #formRef="ngForm">
    <h2>Registro</h2>

    <label for="name">Nombre y Apellidos:</label>
    <input type="text" id="name" name="name" [(ngModel)]="formData.name" required>

    <label for="email">Correo Electrónico:</label>
    <input type="email" id="email" name="email" [(ngModel)]="formData.email" required>

    <label for="nif">NIF/NIE (sin letra):</label>
    <input type="text" id="nif" name="nif" [(ngModel)]="formData.nif" required>

    <label for="password">Contraseña:</label>
    <input type="password" id="password" name="password" [(ngModel)]="formData.password" required>

    <label for="phone">Teléfono de Contacto (sin espacios):</label>
    <input type="tel" id="phone" name="phone" [(ngModel)]="formData.phone" required>

    <label for="role">Rol:</label>
    <select id="role" name="role" [(ngModel)]="formData.role" required>
      <option value="profesor">Profesor</option>
      <option value="alumno">Alumno</option>
    </select>

    <button type="submit">Registrarse</button>
  </form>
</main>
