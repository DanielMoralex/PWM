<main class="login-container">
  <form class="login-form" (ngSubmit)="onLogin()" #formRef="ngForm">
    <h2>Inicio de Sesión</h2>

    <label for="login-email">Correo Electrónico:</label>
    <input type="email" id="login-email" name="email" [(ngModel)]="email" required>

    <label for="login-password">Contraseña:</label>
    <input type="password" id="login-password" name="password" [(ngModel)]="password" required>

    <button type="submit">Iniciar Sesión</button>
  </form>
</main>
