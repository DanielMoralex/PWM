<div class="main-content">
  <div class="image-section">
    <img src="assets/fotoRobotica.jpg" alt="Imagen de ejemplo" class="image">
  </div>
  <div id="noticias-section">
    <h3>Últimas Noticias</h3>
    <ul>
      <li *ngFor="let noticia of noticias">
        <strong>{{ noticia.titulo }}</strong><br>
        <p>{{ noticia.contenido }}</p>
      </li>
    </ul>
  </div>
</div>
