<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias</title> <link rel="icon" href="/img/deepseek-ai-icon-seeklogo.ico" sizes="any">
    <link rel="stylesheet" href="/css/headerstyle.css">
    <link rel="stylesheet" href="/css/imagestyle.css">
    <link rel="stylesheet" href="/css/footerstyle.css">
    <link rel="stylesheet" href="../css/logo.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/noticias.css">
</head>

<body>

<div id="header">

</div>

<div class="main-content">
    <div class="image-section">
        <img src="" alt="Imagen de ejemplo" class="image">
    </div>
    <div id="noticias-section">
        <!-- El contenido del sidebar se insertará aquí -->
    </div>
</div>

<div id="footer"></div>

<script>
    document.addEventListener('DOMContentLoaded', init);

    function loadTemplate(fileName, id, callback) {

        fetch(fileName).then((res) => {
            return res.text();
        }).then((text) => {
            document.getElementById(id).innerHTML = text;
            //console.log(text)

            if(callback){
                callback();
            }
        })
    }

    function init() {

        loadTemplate('./header.html', 'header');
        loadTemplate('./footer.html', 'footer');

        cargarImagenes();
        cargarSidebar();

    }

    function cargarImagenes() {
        fetch("/json/imagen.json")
            .then(response => {
                if (!response.ok) {
                    throw new Error("No se pudo cargar el archivo JSON");
                }
                return response.json();
            })
            .then(data => {
                console.log("Datos recibidos del JSON:", data); // Para depuración

                const imagenNoticia = data.find(img => img.id === 2);

                if (imagenNoticia) {
                    const imgElement = document.querySelector(".image");
                    if (!imgElement) {
                        console.error("No se encontró el elemento <img> con la clase 'image'");
                        return;
                    }

                    imgElement.setAttribute("src", imagenNoticia.direccion);
                    console.log("Imagen actualizada con src:", imagenNoticia.direccion);
                } else {
                    console.error("El JSON no tiene la clave 'direccion'");
                }
            })
            .catch(error => console.error("Error al cargar la imagen:", error));
    }

    function cargarSidebar() {
        fetch("/json/noticias.json")
            .then(response => {
                if (!response.ok) {
                    throw new Error("No se pudo cargar el archivo JSON de noticias");
                }
                return response.json();
            })
            .then(noticias => {
                const sidebar = document.getElementById('noticias-section');
                if (!sidebar) {
                    console.error("No se encontró el contenedor del sidebar");
                    return;
                }

                // Limpiar el contenido del sidebar antes de agregar los nuevos elementos
                sidebar.innerHTML = '';

                noticias.forEach(noticia => {
                    const noticiaDiv = document.createElement('div');
                    noticiaDiv.classList.add('noticias-section');

                    const titulo = document.createElement('h2');
                    titulo.textContent = noticia.title;

                    const descripcion = document.createElement('p');
                    descripcion.textContent = noticia.description;

                    noticiaDiv.appendChild(titulo);
                    noticiaDiv.appendChild(descripcion);

                    sidebar.appendChild(noticiaDiv);
                });
            })
            .catch(error => {
                console.error("Error al cargar el archivo JSON de noticias:", error);
            });
    }
</script>
</body>
</html>
