<!doctype html>
<html class="no-js" lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tienda</title>  <link rel="icon" href="/img/deepseek-ai-icon-seeklogo.ico" sizes="any">
  <link rel="apple-touch-icon" href="../img/deepseek-ai-icon-seeklogo.png">

  <link rel="manifest" href="../other/site.webmanifest">
  <link rel="stylesheet" href="/css/headerstyle.css">
  <link rel="stylesheet" href="/css/imagestyle.css">
  <link rel="stylesheet" href="/css/footerstyle.css">
  <link rel="stylesheet" href="../css/logo.css">
  <link rel="stylesheet" href="../css/tienda.css">
</head>

<body>

<div id="header"></div>

<main class="contenedor">
  <!-- Imagen izquierda -->
  <section class="imagen-izquierda">
    <img src="" alt="Imagen Izquierda" class="chandal">
    <div class="boton1">
      <button> Comprar </button>
    </div>
  </section>

  <!-- Imagen central con dos botones debajo -->
  <section class="imagen-central">
    <img src="" alt="Imagen Central" class="camiseta">
    <div class="boton2">
      <button> Comprar </button>
    </div>
  </section>

  <!-- Botón derecha -->
  <section class="boton-derecha">
    <button> Más Productos </button>
  </section>
</main>

<div id="footer"></div>

  <script>
    document.addEventListener('DOMContentLoaded', init);

    function loadTemplate(fileName, id, callback) {

      fetch(fileName).then((res) => {
        return res.text();
      }).then((text) => {
        document.getElementById(id).innerHTML = text;
        //console.log(text)

        if(callback){
          callback();
        }
      })
    }

    function init() {

      loadTemplate('./header.html', 'header');
      loadTemplate('./footer.html', 'footer');

      cargarImagenes();
      cargarEnlaces();

    }

    function cargarImagenes() {
      fetch("/json/imagen.json")
              .then(response => {
                if (!response.ok) {
                  throw new Error("No se pudo cargar el archivo JSON");
                }
                return response.json();
              })
              .then(data => {
                console.log("Datos recibidos del JSON:", data);

                const imagenIzquierda = data.find(img => img.id === 5);

                if (imagenIzquierda) {
                  const imgElement = document.querySelector(".chandal");
                  if (!imgElement) {
                    console.error("No se encontró el elemento <img alt=\"\" class=\"chandal\" src=\"\"> con la clase 'image'");
                    return;
                  }

                  imgElement.setAttribute("src", imagenIzquierda.direccion);
                  console.log("Imagen actualizada con src:", data.direccion);
                } else {
                  console.error("El JSON no tiene la clave 'direccion'");
                }

              const imagenCentral = data.find(img => img.id === 6);

              if (imagenCentral) {
                const imgElement = document.querySelector(".camiseta");
                if (!imgElement) {
                  console.error("No se encontró el elemento <img alt=\"\" class=\"camiseta\" src=\"\"> con la clase 'image'");
                  return;
                }

                imgElement.setAttribute("src", imagenCentral.direccion);
                console.log("Imagen actualizada con src:", data.direccion);
              } else {
                console.error("El JSON no tiene la clave 'direccion'");
              }
          })
          .catch(error => console.error("Error al cargar la imagen:", error));
    }

    function cargarEnlaces() {
      fetch("/json/links.json")
              .then(response => {
                if (!response.ok) {
                  throw new Error("No se pudo cargar el archivo JSON de enlaces");
                }
                return response.json();
              })
              .then(data => {
                console.log("Datos recibidos del JSON de enlaces:", data);

                // Botón "Comprar Chandal"
                const enlaceChandal = data.find(item => item.nombre === "Chandal");
                if (enlaceChandal) {
                  const botonChandal = document.querySelector(".boton1 button");
                  if (botonChandal) {
                    botonChandal.addEventListener("click", () => {
                      window.location.href = enlaceChandal.url;
                    });
                    console.log("Botón Chandal actualizado:", enlaceChandal.url);
                  } else {
                    console.error("No se encontró el botón de Chandal");
                  }
                }

                // Botón "Comprar Camiseta"
                const enlaceCamiseta = data.find(item => item.nombre === "Camiseta");
                if (enlaceCamiseta) {
                  const botonCamiseta = document.querySelector(".boton2 button");
                  if (botonCamiseta) {
                    botonCamiseta.addEventListener("click", () => {
                      window.location.href = enlaceCamiseta.url;
                    });
                    console.log("Botón Camiseta actualizado:", enlaceCamiseta.url);
                  } else {
                    console.error("No se encontró el botón de Camiseta");
                  }
                }

                // Botón "Más Productos"
                const enlaceTienda = data.find(item => item.nombre === "Tienda");
                if (enlaceTienda) {
                  const botonTienda = document.querySelector(".boton-derecha button");
                  if (botonTienda) {
                    botonTienda.addEventListener("click", () => {
                      window.location.href = enlaceTienda.url;
                    });
                    console.log("Botón Tienda actualizado:", enlaceTienda.url);
                  } else {
                    console.error("No se encontró el botón de la Tienda");
                  }
                }

              })
              .catch(error => console.error("Error al cargar los enlaces:", error));
    }
  </script>

</body>
</html>
