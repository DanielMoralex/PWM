<!doctype html>
<html class="no-js" lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tienda</title>  <link rel="icon" href="/img/deepseek-ai-icon-seeklogo.ico" sizes="any">
  <link rel="apple-touch-icon" href="../img/deepseek-ai-icon-seeklogo.png">

  <link rel="manifest" href="../other/site.webmanifest">
  <link rel="stylesheet" href="/css/headerstyle.css">
  <link rel="stylesheet" href="/css/imagestyle.css">
  <link rel="stylesheet" href="/css/footerstyle.css">
  <link rel="stylesheet" href="../css/logo.css">
  <link rel="stylesheet" href="../css/tienda.css">
</head>

<body>

<div id="header"></div>

<main class="contenedor">
  <!-- Imagen izquierda -->
  <section class="imagen-izquierda">
    <img src="../img/chandal.jpg" alt="Imagen Izquierda">
    <div class="boton1">
      <button onclick="location.href='https://hipertextilcavero.com/hijas-de-la-caridad-vicencianos/1107-chandal-hijas-de-la-caridad-vicencianos.html'">Comprar</button>
    </div>
  </section>

  <!-- Imagen central con dos botones debajo -->
  <section class="imagen-central">
    <img src="../img/camisetaMC.jpg" alt="Imagen Central">
    <div class="boton2">
      <button onclick="location.href='https://hipertextilcavero.com/hijas-de-la-caridad-vicencianos/2556-camiseta-manga-corta-hijas-de-la-caridad-vicencianos-bordada.html'">Comprar</button>
    </div>
  </section>

  <!-- Botón derecha -->
  <section class="boton-derecha">
    <boton-derecha onclick="location.href='https://hipertextilcavero.com/329-sagrado-corazon-de-arnedo-la-rioja'">Más Productos</boton-derecha>
  </section>
</main>

<div id="footer"></div>

  <script>
    document.addEventListener('DOMContentLoaded', init);

    function loadTemplate(fileName, id, callback) {

      fetch(fileName).then((res) => {
        return res.text();
      }).then((text) => {
        document.getElementById(id).innerHTML = text;
        //console.log(text)

        if(callback){
          callback();
        }
      })
    }

    function init() {

      loadTemplate('./header.html', 'header');
      loadTemplate('./footer.html', 'footer');

    }

    function cargarImagenes() {
      fetch("/json/imagen.json")
              .then(response => {
                if (!response.ok) {
                  throw new Error("No se pudo cargar el archivo JSON");
                }
                return response.json();
              })
              .then(data => {
                console.log("Datos recibidos del JSON:", data);

                const imagenFachada = data.find(img => img.id === 1);

                if (imagenFachada) {
                  const imgElement = document.querySelector(".image");
                  if (!imgElement) {
                    console.error("No se encontró el elemento <img alt=\"\" class=\"image\" src=\"\"> con la clase 'image'");
                    return;
                  }

                  imgElement.setAttribute("src", imagenFachada.direccion);
                  imgElement.setAttribute("alt", imagenFachada.alt);
                  imgElement.classList.add("fachada-colegio");
                  console.log("Imagen actualizada con src:", data.direccion);
                } else {
                  console.error("El JSON no tiene la clave 'direccion'");
                }
              })
              .catch(error => console.error("Error al cargar la imagen:", error));
    }
  </script>

</body>
</html>
