<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perfil</title>  <link rel="icon" href="/img/deepseek-ai-icon-seeklogo.ico" sizes="any">
  <link rel="apple-touch-icon" href="../img/deepseek-ai-icon-seeklogo.png">

  <link rel="manifest" href="../other/site.webmanifest">
  <link rel="stylesheet" href="/css/headerstyle.css">
  <link rel="stylesheet" href="/css/imagestyle.css">
  <link rel="stylesheet" href="/css/footerstyle.css">
  <link rel="stylesheet" href="../css/logo.css">
  <link rel="stylesheet" href="../css/perfil_alumno.css">
</head>

<body>

<div id="header"></div>

<div class="container">
  <img src="" alt="Imagen del Perfil" class="left-image">
  <p id="user-name" class="user-name">Cargando usuario...</p>
  <img src="" alt="Imagen central" class="center-image">
  <div class="right-section">
    <h2>Notas</h2>
    <p class="Notas">Aquí puedes ver tus calificaciones.</p>
  </div>
</div>

<div id="footer"></div>

<script>
  // Intentar obtener los datos del usuario desde localStorage
  const userData = JSON.parse(localStorage.getItem("perfil"));

  if (userData && userData.name) {
    document.getElementById("user-name").textContent = userData.name;
  } else {
    document.getElementById("user-name").textContent = "Usuario Desconocido";
  }
</script>

<script>
  document.addEventListener('DOMContentLoaded', init);

  function loadTemplate(fileName, id, callback) {

    fetch(fileName).then((res) => {
      return res.text();
    }).then((text) => {
      document.getElementById(id).innerHTML = text;
      //console.log(text)

      if(callback){
        callback();
      }
    })
  }

  function init() {
    loadTemplate('./header.html', 'header');
    loadTemplate('./footer.html', 'footer');

    cargarImagenes();
    cargarSidebar();
  }

  function cargarImagenes() {
    fetch("/json/imagen.json")
            .then(response => {
              if (!response.ok) {
                throw new Error("No se pudo cargar el archivo JSON");
              }
              return response.json();
            })
            .then(data => {
              console.log("Datos recibidos del JSON:", data);

              const imagenPerfil = data.find(img => img.id === 7);

              if (imagenPerfil) {
                const imgElement = document.querySelector(".left-image");
                if (!imgElement) {
                  console.error("No se encontró el elemento <img alt=\"\" class=\"left-image\" src=\"\"> con la clase 'image'");
                  return;
                }

                imgElement.setAttribute("src", imagenPerfil.direccion);
                console.log("Imagen actualizada con src:", imagenPerfil.direccion);
              } else {
                console.error("El JSON no tiene la clave 'direccion'");
              }

              const imagenHorario = data.find(img => img.id === 3);

              if (imagenHorario) {
                const imgElement = document.querySelector(".center-image");
                if (!imgElement) {
                  console.error("No se encontró el elemento <img alt=\"\" class=\"center-image\" src=\"\"> con la clase 'image'");
                  return;
                }

                imgElement.setAttribute("src", imagenHorario.direccion);
                console.log("Imagen actualizada con src:", imagenHorario.direccion);
              } else {
                console.error("El JSON no tiene la clave 'direccion'");
              }
            })
            .catch(error => console.error("Error al cargar la imagen:", error));
  }

  function cargarSidebar() {
    fetch("/json/notas.json")
            .then(response => {
              if (!response.ok) {
                throw new Error("No se pudo cargar el archivo JSON de notas");
              }
              return response.json();
            })
            .then(notas => {
              const sidebar = document.getElementById('right-section');
              if (!sidebar) {
                console.error("No se encontró el contenedor del sidebar");
                return;
              }

              // Limpiar el contenido del sidebar antes de agregar los nuevos elementos
              sidebar.innerHTML = '';

              notas.forEach(nota => {
                const asignatura = document.createElement('h3');
                asignatura.textContent = nota.asignatura;

                const calificacion = document.createElement('p');
                calificacion.textContent = nota.calificacion;
              });
            })
            .catch(error => {
              console.error("Error al cargar el archivo JSON de noticias:", error);
            });
  }
</script>

</body>
</html>
