  <link rel="manifest" href="../other/site.webmanifest">

  <link rel="stylesheet" href="/css/imagestyle.css">
  <link rel="stylesheet" href="/css/footerstyle.css">
  <link rel="stylesheet" href="../css/logo.css">
</head>

<body>
<div id="container">

<div id="header">

</div>

</div>

<!--img src="../img/fachada-de-colegio-confucio.gif" alt="Descripción de la imagen" class="image"-->

<div id="container2">

  <!-- Begin #container3 keeps the left col and body positioned-->
  <div id="container3">

    <!-- Begin #content -->
    <div id="content">

    </div><!-- //content -->

    <!-- #left sidebar -->
    <div id="sidebarLT">

      <div id="articles">

      </div>

      <div id="categories">

      </div>

      <div id="links">

      </div>


    </div>
  </div><!--//container3-->

  <!-- #right sidebar -->
  <div id="sidebarRT">


    <div id="users">
      <template id="user-card-template">
        <div class="user">
          <div class="profile">

            <h2></h2>
            <span class="title"></span>
            <img alt="Imagen del colegio" />

          </div>


        </div>
      </template>
    </div>

    <div id="imagen"></div>
  </div><!--//sidebarRT -->

  <div id="pushbottom"></div>
  <!--
  this div will span across the 3 divs above it making sure the footer
  stays at the bottom of the longest column
  -->

</div>

<footer>
  <div xlu-include-file="footer.html"></div> <!-- Aquí se cargará footer.html -->
</footer>

<script>
  document.addEventListener('DOMContentLoaded', init);

  const supportsTemplate = function () {
    //create a template element and make sure it has a 'content' property
    return 'content' in document.createElement('template');
  }

  function loadTemplate(fileName, id, callback) {

    fetch(fileName).then((res) => {
      return res.text();
    }).then((text) => {
      document.getElementById(id).innerHTML = text;
      //console.log(text)

      if(callback){
        callback();
      }
    })
  }

  function init() {

    loadTemplate('./header.html', 'header');

    addSideBarContent();

  }

  function addSideBarContent() {
    fetch('/json/imagen.json')
            .then((response) => response.json())
            .then((imagen) => {
              if ('content' in document.createElement('template')) {
                const container = document.getElementById('imagen');

                imagen.forEach((image) => {
                  const tmpl = document
                          .getElementById('user-card-template')
                          .content.cloneNode(true);

                  // Asegúrate de que el template tiene un <img> y no <image>
                  tmpl.querySelector('img').src = image.direccion; // Usamos src en lugar de innerText

                  container.appendChild(tmpl);
                });
              } else {
                console.error('Your browser does not support templates');
              }
            })
            .catch((err) => console.error(err));
  }


  function addPostContent() {
    if (supportsTemplate()) {
      //We can use the template element in our HTML
      console.log('Templates are supported.');

      document.getElementById('post_1').remove();
      document.getElementById('post_2').remove();

      let temp = document.getElementById('post_content_template');
      let content = temp.content;
      console.log(content);
      let target = document.getElementById('post_template');
      target.appendChild(content.cloneNode(true))
      target.appendChild(content.cloneNode(true));

    } else {

      //Use another method, like manually building the elements.
      console.log('The else is running');

      fetch('./post_content_support.html').then((res) => {
        return res.text();
      }).then((text) => {
        document.getElementById('post_1').innerHTML = text;
        document.getElementById('post_2').innerHTML = text;

        console.log(text)
      })

    }


  }

</script>

</body>

</html>
