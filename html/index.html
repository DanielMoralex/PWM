<!doctype html>
<html class="no-js" lang="">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colegio</title>
  <link rel="stylesheet" href="../css/style.css">
  <meta name="description" content="">

  <link rel="icon" href="/img/deepseek-ai-icon-seeklogo.ico" sizes="any">
  <link rel="apple-touch-icon" href="../img/deepseek-ai-icon-seeklogo.png">
  <link rel="manifest" href="../other/site.webmanifest">
  <link rel="stylesheet" href="/css/headerstyle.css">
  <link rel="stylesheet" href="/css/imagestyle.css">
  <link rel="stylesheet" href="/css/footerstyle.css">
  <link rel="stylesheet" href="../css/logo.css">
</head>

<body>
<div id="container">
  <div id="header"></div>
</div>
<img src="" alt="" class="image">
<div id="container2">
  <!-- Begin #container3 keeps the left col and body positioned-->
  <div id="container3">
    <!-- Begin #content -->
    <div id="content">
    </div><!-- //content -->
    <!-- #left sidebar -->
    <div id="sidebarLT">
      <div id="articles">
      </div>
      <div id="categories">
      </div>
      <div id="links">
      </div>
    </div>
  </div><!--//container3-->
  <!-- #right sidebar -->
  <div id="sidebarRT">
    <div id="users">
      <template id="user-card-template">
        <div class="user">
          <div class="profile">
            <h2></h2>
            <span class="title"></span>
          </div>
        </div>
      </template>
    </div>
    <div id="imagen"></div>
  </div><!--//sidebarRT -->
  <div id="pushbottom"></div>
  <!--
  this div will span across the 3 divs above it making sure the footer
  stays at the bottom of the longest column
  -->
</div>
<div id="footer"></div>

<script>
  document.addEventListener('DOMContentLoaded', init);

  function loadTemplate(fileName, id, callback) {

    fetch(fileName).then((res) => {
      return res.text();
    }).then((text) => {
      document.getElementById(id).innerHTML = text;
      //console.log(text)

      if(callback){
        callback();
      }
    })
  }

  function init() {

    loadTemplate('./header.html', 'header');
    loadTemplate('./footer.html', 'footer');

    cargarImagenes();

  }

  function cargarImagenes() {
    fetch("/json/imagen.json")
            .then(response => {
              if (!response.ok) {
                throw new Error("No se pudo cargar el archivo JSON");
              }
              return response.json();
            })
            .then(data => {
              console.log("Datos recibidos del JSON:", data); // Para depuración

              const imagenFachada = data.find(img => img.id === 1);

              if (imagenFachada) {
                const imgElement = document.querySelector(".image");
                if (!imgElement) {
                  console.error("No se encontró el elemento <img alt=\"\" class=\"image\" src=\"\"> con la clase 'image'");
                  return;
                }

                imgElement.setAttribute("src", imagenFachada.direccion);
                imgElement.setAttribute("alt", imagenFachada.alt);
                imgElement.classList.add("fachada-colegio");
                console.log("Imagen actualizada con src:", data.direccion);
              } else {
                console.error("El JSON no tiene la clave 'direccion'");
              }
            })
            .catch(error => console.error("Error al cargar la imagen:", error));
  }
</script>
</body>
</html>
